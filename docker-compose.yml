services:
  mysql:
    image: mysql:8.4
    container_name: art-studio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: art_studio
      MYSQL_USER: art_studio_app
      MYSQL_PASSWORD: change-me-local-only
      MYSQL_ROOT_PASSWORD: change-root-local-only
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - art_studio_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pchange-root-local-only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  art_studio_mysql_data:
