<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾色画室 UI 与交互预览</title>
  <style>
    :root { --ink:#1e2c27; --muted:#708078; --line:#dfe9e4; --page:#eef4f1; --panel:#fff; --green:#16785c; --green-soft:#e5f4ed; --blue:#3e78d6; --blue-soft:#e8f1ff; --purple:#7a61d9; --purple-soft:#eeeaff; --orange:#ce7821; --orange-soft:#fff0dd; --red:#c6525e; --shadow:0 12px 30px rgba(36,72,58,.08); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--page); font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    button, input, textarea, select { font:inherit; }
    button { border:0; cursor:pointer; }
    button:focus-visible, input:focus, textarea:focus, select:focus { outline:2px solid #8fcbb6; outline-offset:2px; }
    .topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:15px 24px; background:rgba(255,255,255,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#173c32,#2b9b76); color:#fff; font-size:19px; font-weight:800; box-shadow:0 4px 10px rgba(22,120,92,.18); }
    .brand strong { display:block; font-size:16px; }
    .brand small { display:block; color:var(--muted); font-size:11px; }
    .mode-switch { display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:10px; background:#f4f8f6; }
    .mode-switch button { padding:8px 15px; border-radius:7px; color:#6d7c75; background:transparent; }
    .mode-switch button.active { color:var(--green); background:#fff; box-shadow:0 2px 7px rgba(30,69,54,.1); font-weight:700; }
    .preview-note { max-width:1280px; margin:16px auto 0; padding:0 22px; color:var(--muted); font-size:12px; }
    .screen { display:none; max-width:1280px; margin:0 auto; padding:16px 22px 42px; }
    .screen.active { display:block; }

    /* 小程序端预览 */
    .mini-stage { display:flex; justify-content:center; }
    .phone { width:min(430px,100%); min-height:750px; overflow:hidden; border:1px solid #dce7e1; border-radius:25px; background:#f7faf8; box-shadow:var(--shadow); }
    .phone-head { padding:17px 19px 13px; border-bottom:1px solid var(--line); background:#fff; }
    .phone-head b { font-size:17px; }
    .phone-head small { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .mini-view { min-height:630px; padding:16px 15px 74px; }
    .mini-hero { padding:26px 20px; border-radius:13px; background:#dfeee7; }
    .mini-hero .eyebrow { color:#497466; font-size:12px; }
    .mini-hero h1 { margin:7px 0; font-size:27px; line-height:1.25; }
    .mini-hero p { margin:0; color:#58756b; }
    .mini-section { margin-top:17px; }
    .mini-section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
    .mini-section-head h2, .mini-view > h2 { margin:0; font-size:17px; }
    .mini-link { padding:0; color:var(--green); background:transparent; font-size:12px; }
    .mini-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
    .mini-tile { padding:15px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#40534b; text-align:center; }
    .mini-tile b { display:block; margin-top:7px; font-size:13px; }
    .mini-icon { display:grid; place-items:center; width:36px; height:36px; margin:0 auto; border-radius:50%; color:#fff; font-weight:700; }
    .mini-icon.green { background:#42a57f; } .mini-icon.blue { background:#5487c8; } .mini-icon.purple { background:#8c70d2; } .mini-icon.orange { background:#d58a43; }
    .mini-card { padding:14px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .mini-card + .mini-card { margin-top:9px; }
    .mini-card h3 { margin:0; font-size:15px; }
    .mini-card p { margin:6px 0; color:var(--muted); font-size:12px; }
    .mini-row { display:flex; align-items:center; justify-content:space-between; gap:9px; }
    .mini-price { color:var(--green); font-size:17px; font-weight:700; }
    .mini-button { padding:9px 13px; border-radius:7px; color:#fff; background:var(--green); font-size:12px; font-weight:700; }
    .mini-button.outline { color:var(--green); border:1px solid #a8d1c0; background:#fff; }
    .mini-button.full { width:100%; }
    .mini-tabs { display:flex; gap:7px; margin:12px 0; overflow:auto; }
    .mini-tabs button { flex:0 0 auto; padding:7px 11px; border:1px solid var(--line); border-radius:16px; color:#68776f; background:#fff; font-size:12px; }
    .mini-tabs button.active { color:var(--green); border-color:#96cdb7; background:var(--green-soft); font-weight:700; }
    .mini-banner { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px; border-radius:10px; background:#203f35; color:#fff; }
    .mini-banner b { display:block; font-size:15px; } .mini-banner small { display:block; margin-top:3px; color:#cde5da; }
    .mini-bottom-nav { position:relative; display:grid; grid-template-columns:repeat(4,1fr); padding:10px 4px 8px; border-top:1px solid var(--line); background:#fff; }
    .mini-bottom-nav button { padding:4px 2px; color:#7a8982; background:transparent; font-size:11px; }
    .mini-bottom-nav button.active { color:var(--green); font-weight:700; }
    .mini-empty { padding:32px 10px; color:var(--muted); text-align:center; }
    .mini-notice { margin-bottom:10px; padding:9px 10px; border-radius:7px; color:#8a5a20; background:var(--orange-soft); font-size:12px; }
    .art-thumb, .gallery-large { border-radius:8px; background:linear-gradient(135deg,#e8b37c 0 38%,#80b99d 39% 68%,#d97670 69%); }
    .art-thumb { height:92px; } .art-two { background:linear-gradient(135deg,#76afa3 0 42%,#efd48d 43% 67%,#d98d9c 68%); }
    .gallery-large { height:190px; margin-bottom:12px; background:linear-gradient(140deg,#f0c49a 0 26%,#8dc6ad 27% 49%,#6f92c9 50% 72%,#dd8c8c 73%); }

    /* Web 管理端预览 */
    .web-shell { display:grid; grid-template-columns:230px minmax(0,1fr); min-height:720px; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#f4f8f6; box-shadow:var(--shadow); }
    .web-sidebar { display:flex; flex-direction:column; gap:17px; padding:18px 11px; border-right:1px solid var(--line); background:#fff; transition:.2s; }
    .web-sidebar.collapsed { width:68px; }
    .web-brand { display:flex; align-items:center; gap:10px; padding:0 7px 9px; }
    .web-brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:9px; color:#fff; background:#1b8968; font-weight:800; }
    .web-brand-copy b { display:block; font-size:15px; } .web-brand-copy small { display:block; color:var(--muted); font-size:10px; }
    .web-sidebar.collapsed .web-brand-copy, .web-sidebar.collapsed .nav-label, .web-sidebar.collapsed .sidebar-foot em { display:none; }
    .web-nav { display:flex; flex-direction:column; gap:3px; }
    .web-nav button { display:flex; align-items:center; gap:10px; width:100%; padding:10px; border-radius:8px; color:#65746d; background:transparent; text-align:left; }
    .web-nav button.active { color:var(--green); background:var(--green-soft); font-weight:700; }
    .web-nav button span { width:18px; text-align:center; }
    .web-sidebar.collapsed .web-nav button { justify-content:center; padding-left:0; padding-right:0; }
    .sidebar-foot { display:flex; flex-direction:column; gap:4px; margin-top:auto; padding-top:10px; border-top:1px solid var(--line); }
    .sidebar-foot button { padding:9px; color:#65746d; background:transparent; text-align:left; }
    .web-main { min-width:0; background:#f4f8f6; }
    .web-header { display:flex; align-items:center; justify-content:space-between; gap:15px; min-height:70px; padding:0 25px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.9); }
    .web-header h1 { margin:0; font-size:19px; } .web-header p { margin:3px 0 0; color:var(--muted); font-size:11px; }
    .web-header-actions { display:flex; align-items:center; gap:10px; }
    .web-avatar { display:grid; place-items:center; width:30px; height:30px; border-radius:50%; color:#fff; background:#258b6b; font-size:12px; font-weight:700; }
    .web-user small { display:block; color:var(--muted); font-size:10px; } .web-user b { display:block; font-size:12px; }
    .web-icon-button { padding:7px; color:#64736c; background:transparent; }
    .web-content { padding:24px 25px 35px; }
    .web-page-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .web-page-head h2 { margin:0; font-size:18px; } .web-page-head p { margin:3px 0 0; color:var(--muted); font-size:11px; }
    .web-primary, .web-secondary { padding:9px 12px; border-radius:7px; font-size:12px; font-weight:700; }
    .web-primary { color:#fff; background:var(--green); } .web-secondary { color:#54645c; border:1px solid var(--line); background:#fff; }
    .web-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .stat { display:flex; gap:10px; padding:15px; border:1px solid #e9f0ec; border-radius:11px; background:#fff; }
    .stat-icon { display:grid; place-items:center; width:36px; height:36px; border-radius:9px; color:var(--blue); background:var(--blue-soft); font-size:17px; font-weight:700; }
    .stat:nth-child(2) .stat-icon { color:var(--green); background:var(--green-soft); } .stat:nth-child(3) .stat-icon { color:var(--purple); background:var(--purple-soft); } .stat:nth-child(4) .stat-icon { color:var(--orange); background:var(--orange-soft); }
    .stat small { display:block; color:var(--muted); font-size:11px; } .stat strong { display:block; margin:1px 0; font-size:22px; }
    .web-panels { display:grid; grid-template-columns:1.2fr .8fr; gap:14px; margin-top:14px; }
    .web-panel { padding:16px; border:1px solid #e9f0ec; border-radius:11px; background:#fff; }
    .web-panel h3 { margin:0; font-size:14px; } .web-panel > small { color:var(--muted); font-size:11px; }
    .chart { display:flex; align-items:end; gap:9px; height:170px; margin-top:15px; padding:10px 3px 0; border-bottom:1px solid var(--line); }
    .bar-wrap { display:flex; flex:1; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:end; }
    .bar { width:100%; max-width:28px; min-height:8px; border-radius:5px 5px 0 0; background:#6bb89a; }
    .bar-wrap small { color:var(--muted); font-size:10px; }
    .role-row { display:grid; grid-template-columns:9px 1fr auto; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid #eef3f0; font-size:12px; }
    .role-row:last-child { border-bottom:0; } .role-dot { width:8px; height:8px; border-radius:50%; }
    .quick-actions { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:13px; }
    .quick-actions button { min-height:72px; padding:10px; border-radius:8px; color:#52635a; background:#f3f8f5; text-align:left; }
    .quick-actions button:hover { background:var(--green-soft); } .quick-actions b { display:block; margin-top:5px; font-size:12px; } .quick-actions small { color:var(--muted); font-size:10px; }
    .web-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:10px; border:1px solid #e9f0ec; border-radius:10px; background:#fff; }
    .web-search { flex:1; min-width:160px; padding:9px 10px; border:1px solid var(--line); border-radius:7px; }
    .web-table-wrap { overflow:auto; border:1px solid #e9f0ec; border-radius:10px; background:#fff; }
    .web-table { width:100%; min-width:650px; border-collapse:collapse; }
    .web-table th { padding:11px 13px; color:#74837b; background:#fbfdfc; font-size:11px; font-weight:600; text-align:left; white-space:nowrap; }
    .web-table td { padding:12px 13px; border-top:1px solid #edf2ef; font-size:12px; white-space:nowrap; }
    .table-actions { display:flex; gap:7px; } .table-action { padding:2px 0; color:var(--green); background:transparent; font-size:11px; }
    .tag { display:inline-block; padding:3px 7px; border-radius:12px; color:#68766f; background:#eef3f0; font-size:10px; }
    .tag.green { color:#177b5a; background:#e2f5eb; } .tag.orange { color:#a96117; background:#fff0d9; } .tag.red { color:#b24a57; background:#ffe8eb; } .tag.blue { color:#3a70be; background:#e8f1ff; }
    .web-empty { padding:35px; color:var(--muted); text-align:center; }

    .modal-layer { position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:18px; background:rgba(20,39,31,.38); }
    .modal-layer.show { display:grid; }
    .modal-card { width:min(470px,100%); max-height:calc(100vh - 36px); overflow:auto; border-radius:13px; background:#fff; box-shadow:0 18px 50px rgba(18,40,31,.23); }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line); } .modal-head h3 { margin:0; font-size:16px; }
    .close-button { padding:2px 7px; color:#74817b; background:transparent; font-size:20px; }
    .modal-body { padding:17px 18px; } .modal-body p { color:var(--muted); font-size:12px; }
    .field { margin-bottom:12px; } .field label { display:block; margin-bottom:6px; color:#53635b; font-size:11px; } .field input, .field textarea, .field select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; } .field textarea { min-height:76px; resize:vertical; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:17px; }
    .toast { position:fixed; left:50%; bottom:25px; z-index:30; padding:10px 14px; border-radius:8px; color:#fff; background:#213a31; opacity:0; transform:translate(-50%,16px); pointer-events:none; transition:.2s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    body.dark-preview { --ink:#e7efeb; --muted:#9aaca3; --line:#2b3a33; --page:#0f1713; --panel:#17231d; --green-soft:rgba(35,161,120,.16); }
    body.dark-preview .web-shell, body.dark-preview .web-main { background:#101914; } body.dark-preview .web-sidebar, body.dark-preview .web-header, body.dark-preview .web-panel, body.dark-preview .stat, body.dark-preview .web-table-wrap, body.dark-preview .web-toolbar, body.dark-preview .web-secondary { background:#17231d; border-color:var(--line); }
    body.dark-preview .web-header { background:rgba(23,35,29,.9); } body.dark-preview .web-table th { color:#9aacA3; background:#142019; } body.dark-preview .web-table td, body.dark-preview .role-row { border-color:#26352e; } body.dark-preview .quick-actions button { color:#c2d0c8; background:#1d2c24; } body.dark-preview .web-search, body.dark-preview .field input, body.dark-preview .field textarea, body.dark-preview .field select { color:var(--ink); background:#101914; border-color:var(--line); }
    @media (max-width:900px) { .web-shell { grid-template-columns:68px minmax(0,1fr); } .web-sidebar { width:68px; padding-left:8px; padding-right:8px; } .web-brand-copy, .nav-label, .sidebar-foot em { display:none; } .web-nav button { justify-content:center; padding-left:0; padding-right:0; } .web-stats { grid-template-columns:repeat(2,1fr); } .web-panels { grid-template-columns:1fr; } }
    @media (max-width:600px) { .topbar { align-items:flex-start; flex-direction:column; padding:13px 15px; } .mode-switch { width:100%; } .mode-switch button { flex:1; } .screen { padding:10px 10px 28px; } .phone { border-radius:18px; } .web-header { padding:0 14px; } .web-content { padding:17px 13px 28px; } .web-header-actions .web-user { display:none; } .web-stats { gap:8px; } .stat { padding:11px; } .stat strong { font-size:19px; } .quick-actions { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">拾</div><div><strong>拾色画室</strong><small>小程序与 Web UI 交互预览</small></div></div>
    <div class="mode-switch" role="tablist" aria-label="预览端选择"><button id="miniModeButton" class="active" role="tab" aria-selected="true" onclick="setMode('mini')">小程序端</button><button id="webModeButton" role="tab" aria-selected="false" onclick="setMode('web')">Web 管理端</button></div>
  </header>
  <p class="preview-note">离线演示文件：页面使用本地演示数据，不调用后端接口。小程序真机/开发者工具请打开项目目录，Web 生产页面请使用 Cloudflare Worker 部署后的地址。</p>

  <main id="miniScreen" class="screen active" aria-label="小程序端预览">
    <div class="mini-stage"><section class="phone"><header class="phone-head"><b>拾色画室</b><small>少儿美术课程与成长服务</small></header><div id="miniView" class="mini-view"></div><nav id="miniNav" class="mini-bottom-nav" aria-label="小程序底部导航"></nav></section></div>
  </main>

  <main id="webScreen" class="screen" aria-label="Web 管理端预览">
    <div class="web-shell"><aside id="webSidebar" class="web-sidebar"><div class="web-brand"><div class="web-brand-mark">拾</div><div class="web-brand-copy"><b>拾色画室</b><small>运营管理台 v1.0</small></div></div><nav id="webNav" class="web-nav" aria-label="后台菜单"></nav><div class="sidebar-foot"><button onclick="toggleWebDark()"><span>◐</span> <em>深色模式</em></button><button onclick="toggleWebCollapse()"><span>«</span> <em>收起菜单</em></button></div></aside><section class="web-main"><header class="web-header"><div><h1 id="webHeaderTitle">运营仪表盘</h1><p id="webHeaderDesc">全局运营概览与访问趋势</p></div><div class="web-header-actions"><button class="web-icon-button" title="通知" onclick="showToast('暂无未读系统通知')">♧</button><div class="web-avatar">管</div><div class="web-user"><b>演示管理员</b><small>拾色画室 · 运营后台</small></div><button class="web-secondary" onclick="showToast('当前为离线交互预览')">退出</button></div></header><div id="webContent" class="web-content"></div></section></div>
  </main>

  <div id="miniModal" class="modal-layer" aria-hidden="true"><section class="modal-card" role="dialog" aria-modal="true"><header class="modal-head"><h3 id="miniModalTitle"></h3><button class="close-button" onclick="closeMiniModal()" aria-label="关闭">×</button></header><div id="miniModalBody" class="modal-body"></div></section></div>
  <div id="webModal" class="modal-layer" aria-hidden="true"><section class="modal-card" role="dialog" aria-modal="true"><header class="modal-head"><h3 id="webModalTitle"></h3><button class="close-button" onclick="closeWebModal()" aria-label="关闭">×</button></header><div id="webModalBody" class="modal-body"></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (selector) => document.querySelector(selector)
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]))
    const money = (value) => `¥${Number(value || 0).toLocaleString('zh-CN')}`
    let toastTimer

    const miniState = {
      page: 'home', filter: 'ALL', cart: [], orders: [], address: null, leaveSubmitted: false,
      courses: [
        { id: 1, name: '创意美术启蒙班', category: 'INTRO', age: '6-8 岁', lessons: 12, price: 1680, desc: '从色彩、构图与手作开始，建立观察力和表达力。' },
        { id: 2, name: '少儿创作进阶班', category: 'ADVANCED', age: '8-11 岁', lessons: 16, price: 2280, desc: '主题表达、材料探索与作品展示，适合已有基础的孩子。' },
        { id: 3, name: '周末创意工坊', category: 'INTRO', age: '5-8 岁', lessons: 4, price: 680, desc: '周末主题创作活动，适合第一次体验画室课程。' }
      ],
      products: [{ id: 1, name: '儿童创作画材套装', price: 99, stock: 36 }, { id: 2, name: '画室原创帆布袋', price: 49, stock: 52 }]
    }

    // Web 端使用独立的演示数据，确保此文件脱离 API 也能展示完整交互。
    const webState = {
      page: 'dashboard', dark: false, collapsed: false, search: '',
      users: [{ name: '李女士', role: '家长', status: '正常' }, { name: '王老师', role: '教师', status: '正常' }, { name: '陈同学', role: '学生', status: '正常' }],
      children: [{ name: '乐乐', guardian: '李女士', classes: '创意美术启蒙班', lessons: 12 }, { name: '安安', guardian: '李女士', classes: '周末创意工坊', lessons: 6 }],
      courses: [{ name: '创意美术启蒙班', category: '艺术启蒙', lessons: 12, price: 1680, status: '已发布' }, { name: '少儿创作进阶班', category: '创作进阶', lessons: 16, price: 2280, status: '草稿' }],

    function renderWebTable(content, key, collection) { const labels = { users:['用户','身份','状态','操作'], children:['学员','监护人','在读班级','剩余课时'], courses:['课程','分类','课时 / 价格','状态','操作'], products:['商品','分类','库存','价格','状态','操作'], resources:['资源','类型','状态','操作'], schedule:['班级','课程','教师','状态','操作'], announcements:['标题','面向','状态','发布时间','操作'] }; const fields = labels[key] || ['名称','状态','操作']; const filtered = collection.filter((row) => !webState.search || Object.values(row).join(' ').includes(webState.search)); const rows = filtered.map((row,index) => { if (key === 'users') return [row.name,row.role,statusTag(row.status),'查看']; if (key === 'children') return [row.name,row.guardian,row.classes,`${row.lessons} 次`]; if (key === 'courses') return [row.name,row.category,`${row.lessons} 次 · ${money(row.price)}`,statusTag(row.status),`<button class="table-action" onclick="showToast('已打开课程编辑')">编辑</button>`]; if (key === 'products') return [row.name,row.category,row.stock,money(row.price),statusTag(row.status),`<button class="table-action" onclick="openWebCreate('products')">调整库存</button>`]; if (key === 'resources') return [row.name,row.type,statusTag(row.status),`<button class="table-action" onclick="showToast('已打开资源详情')">查看</button>`]; if (key === 'schedule') return [row.name,row.course,row.teacher,statusTag(row.status),`<button class="table-action" onclick="showToast('已打开排课详情')">排课</button>`]; if (key === 'announcements') return [row.title,row.audience,statusTag(row.status),row.date,`<button class="table-action" onclick="showToast('公告状态已切换')">下线</button>`]; return Object.values(row).map((value) => escapeHtml(value)); }); content.innerHTML = `<div class="web-page-head"><div><h2>${webPages[key][0]}</h2><p>${webPages[key][1]}</p></div><button class="web-primary" onclick="openWebCreate('${key}')">+ 新增</button></div><div class="web-toolbar"><input class="web-search" placeholder="搜索当前列表" value="${escapeHtml(webState.search)}" oninput="webState.search=this.value; renderWebContent()"><button class="web-secondary" onclick="showToast('列表已刷新')">刷新</button></div>${renderTableHtml(fields,rows)}` }
    function renderTableHtml(headers, rows) { return `<div class="web-table-wrap"><table class="web-table"><thead><tr>${headers.map((header) => `<th>${header}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${headers.length}" class="web-empty">暂无数据</td></tr>`}</tbody></table></div>` }
    function statusTag(status) { const cls = /已发布|在售|正常|已支付|已发货|已完成|已通过/.test(status) ? 'green' : /草稿|待支付|待审批/.test(status) ? 'orange' : /驳回|下架/.test(status) ? 'red' : 'blue'; return `<span class="tag ${cls}">${escapeHtml(status)}</span>` }
    function openWebCreate(kind) { const title = { courses:'新增课程', products:'新增商品', announcements:'发布公告', resources:'上传资源' }[kind] || '新增内容'; let fields = ''; if (kind === 'courses') fields = `<div class="field"><label>课程名称</label><input name="name" required></div><div class="field"><label>课程分类</label><select name="category"><option>艺术启蒙</option><option>创作进阶</option></select></div><div class="field"><label>课时数</label><input name="lessons" type="number" value="12" required></div><div class="field"><label>价格</label><input name="price" type="number" value="1680" required></div>`; if (kind === 'products') fields = `<div class="field"><label>商品名称</label><input name="name" required></div><div class="field"><label>商品分类</label><input name="category" value="画材工具"></div><div class="field"><label>库存</label><input name="stock" type="number" value="0"></div><div class="field"><label>价格</label><input name="price" type="number" value="99"></div>`; if (kind === 'announcements') fields = `<div class="field"><label>公告标题</label><input name="title" required></div><div class="field"><label>面向人群</label><select name="audience"><option>全部用户</option><option>家长端</option><option>教师端</option></select></div><div class="field"><label>公告内容</label><textarea name="content" required></textarea></div>`; if (!fields) fields = `<div class="field"><label>内容名称</label><input name="name" required></div><div class="field"><label>说明</label><textarea name="description"></textarea></div>`; openWebModal(title, `<form id="webCreateForm" onsubmit="submitWebCreate(event,'${kind}')">${fields}<div class="modal-actions"><button type="button" class="web-secondary" onclick="closeWebModal()">取消</button><button class="web-primary">保存</button></div></form>`) }
    function submitWebCreate(event, kind) { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); if (kind === 'courses') webState.courses.unshift({ name:data.name, category:data.category, lessons:Number(data.lessons), price:Number(data.price), status:'草稿' }); else if (kind === 'products') webState.products.unshift({ name:data.name, category:data.category, stock:Number(data.stock), price:Number(data.price), status:'草稿' }); else if (kind === 'announcements') webState.announcements.unshift({ title:data.title, audience:data.audience, status:'草稿', date:'今天' }); closeWebModal(); showToast('内容已保存'); renderWebContent() }
    function reviewWebLeave(index,status) { webState.leaves[index].status = status; showToast(`请假申请${status}`); renderWebContent() }
    function openWebModal(title,body) { $('#webModalTitle').textContent = title; $('#webModalBody').innerHTML = body; $('#webModal').classList.add('show'); $('#webModal').setAttribute('aria-hidden','false') }
    function closeWebModal() { $('#webModal').classList.remove('show'); $('#webModal').setAttribute('aria-hidden','true') }
    function toggleWebDark() { webState.dark = !webState.dark; renderWeb() }
    function toggleWebCollapse() { webState.collapsed = !webState.collapsed; renderWeb() }
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') { closeMiniModal(); closeWebModal() } })
    $('#miniModal').addEventListener('click', (event) => { if (event.target.id === 'miniModal') closeMiniModal() })
    $('#webModal').addEventListener('click', (event) => { if (event.target.id === 'webModal') closeWebModal() })
    renderMini()
  </script>
</body>
