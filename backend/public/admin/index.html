<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纯粹艺术文化 - 运营管理台</title>
  <style>
    :root { --ink:#17241f; --muted:#75827c; --line:#e5ece8; --green:#16785c; --green-soft:#e7f6ef; --blue:#427ee9; --purple:#8465e9; --orange:#db8429; --red:#d65762; --page:#f4f8f6; --panel:#fff; --nav:#fff; --shadow:0 6px 20px rgba(25,61,47,.06); }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--page); } button,input,select,textarea { font:inherit; } button { border:0; cursor:pointer; } button:focus-visible,input:focus,select:focus,textarea:focus { outline:2px solid #8dccb8; outline-offset:2px; }
    .app { min-height:100vh; display:grid; grid-template-columns:248px 1fr; } .sidebar { background:var(--nav); border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:18px; } .brand { padding:2px 10px 11px; display:flex; align-items:center; gap:11px; } .brand-mark { width:37px; height:37px; display:grid; place-items:center; color:#fff; font-size:20px; font-weight:800; background:linear-gradient(135deg,#163e35,#2b9a75); border-radius:10px; box-shadow:0 4px 9px rgba(22,120,92,.18); } .brand b { display:block; font-size:17px; } .brand small { display:block; color:var(--muted); font-size:11px; margin-top:1px; }
    .nav { display:flex; flex-direction:column; gap:3px; } .nav button { width:100%; display:flex; align-items:center; gap:12px; color:#64726d; background:transparent; padding:11px 12px; border-radius:9px; text-align:left; } .nav button span { width:20px; color:#63736d; text-align:center; font-size:17px; } .nav button.active { color:var(--green); background:var(--green-soft); font-weight:700; } .nav button.active span { color:var(--green); } .sidebar-foot { margin-top:auto; border-top:1px solid var(--line); padding:12px 5px 0; } .sidebar-foot button { display:flex; width:100%; align-items:center; gap:10px; padding:10px 8px; color:#6a7772; background:transparent; text-align:left; } .sidebar-foot button span { width:20px; text-align:center; } .sidebar-foot button em { font-style:normal; }
    body.nav-collapsed .app { grid-template-columns:68px 1fr; } body.nav-collapsed .sidebar { padding:18px 8px; } body.nav-collapsed .brand { justify-content:center; padding:2px 0 11px; } body.nav-collapsed .brand > div:last-child { display:none; } body.nav-collapsed .nav button { justify-content:center; padding:11px 0; gap:0; font-size:0; } body.nav-collapsed .nav button span { font-size:17px; } body.nav-collapsed .sidebar-foot button { justify-content:center; gap:0; padding:10px 0; } body.nav-collapsed .sidebar-foot button em { display:none; }
    .main { min-width:0; } .header { height:76px; background:rgba(255,255,255,.88); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; padding:0 30px; position:sticky; top:0; z-index:3; backdrop-filter:blur(14px); } .header h1 { font-size:20px; margin:0; } .header p { color:var(--muted); font-size:12px; margin:3px 0 0; } .head-actions { display:flex; align-items:center; gap:14px; } .head-icon { width:34px; height:34px; color:#65736e; background:transparent; font-size:18px; } .head-link { color:var(--green); background:var(--green-soft); padding:9px 12px; border-radius:8px; text-decoration:none; font-size:12px; font-weight:700; } .admin { display:flex; align-items:center; gap:8px; } .admin .avatar { width:31px; height:31px; display:grid; place-items:center; border-radius:50%; background:#1d9270; color:#fff; font-weight:700; } .admin small { color:var(--muted); display:block; font-size:11px; } .admin b { display:block; font-size:12px; }
    .content { padding:26px 30px 42px; max-width:1700px; } .page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; } .page-head h2 { font-size:19px; margin:0; } .page-head p { margin:4px 0 0; color:var(--muted); font-size:12px; } .primary { background:var(--green); color:#fff; padding:10px 14px; border-radius:8px; font-weight:700; font-size:13px; } .secondary { background:#fff; color:#53625d; border:1px solid var(--line); padding:9px 13px; border-radius:8px; font-size:13px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; } .metric { background:var(--panel); border:1px solid #edf2ef; border-radius:13px; padding:18px; box-shadow:var(--shadow); display:flex; gap:13px; min-height:108px; } .metric-icon { height:43px; width:43px; flex:0 0 43px; display:grid; place-items:center; border-radius:10px; font-size:21px; background:#e4f3ff; color:#367bd7; } .metric-icon.green { background:#dff7e9; color:#18995b; } .metric-icon.orange { background:#fff0d9; color:#d88723; } .metric-icon.purple { background:#eee8ff; color:#805fe1; } .metric small { color:var(--muted); display:block; } .metric strong { font-size:25px; display:block; letter-spacing:.1px; margin:1px 0; } .metric em { color:#20a469; font-style:normal; font-size:12px; } .metric em.down { color:var(--red); }
    .panel { background:var(--panel); border:1px solid #edf2ef; border-radius:14px; box-shadow:var(--shadow); padding:18px; } .panel h3 { margin:0; font-size:16px; } .panel-sub { color:var(--muted); margin:4px 0 0; font-size:12px; } .dashboard-grid { display:grid; grid-template-columns:1.12fr .88fr; gap:18px; margin-top:18px; } .chart-head { display:flex; justify-content:space-between; align-items:start; margin-bottom:14px; } .range { display:flex; gap:5px; background:#f4f7f5; padding:3px; border-radius:7px; } .range button { color:#71807a; background:transparent; padding:5px 8px; border-radius:5px; font-size:11px; } .range button.active { background:#fff; color:var(--green); box-shadow:0 1px 4px rgba(22,60,45,.1); font-weight:700; } .chart-canvas { height:235px; width:100%; display:block; } .split { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; } .role-list { margin-top:14px; } .role-row { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #f0f3f1; } .role-row:last-child { border-bottom:0; } .dot { width:8px; height:8px; border-radius:50%; } .role-row small { color:var(--muted); }
    .quick { margin-top:18px; } .quick-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; } .quick button { background:#f6faf8; min-height:88px; padding:13px; border-radius:10px; color:#4f5e58; text-align:left; } .quick button:hover { background:#eaf6f0; } .quick button i { display:block; font-size:20px; font-style:normal; margin-bottom:8px; } .quick b { display:block; font-size:13px; } .quick small { color:var(--muted); font-size:11px; }
    .toolbar { background:#fff; border:1px solid #edf2ef; border-radius:12px; padding:12px; display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px; } .search { flex:1; min-width:190px; border:1px solid var(--line); border-radius:8px; padding:9px 11px; } .select { color:#51615b; border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 10px; } .table-panel { overflow:auto; padding:0; } table { border-collapse:collapse; width:100%; min-width:760px; } th { color:#78857f; background:#fbfcfb; padding:12px 16px; font-size:12px; text-align:left; font-weight:600; border-bottom:1px solid var(--line); white-space:nowrap; } td { padding:14px 16px; border-bottom:1px solid #edf2ef; font-size:13px; } tr:last-child td { border-bottom:0; } .person { display:flex; gap:9px; align-items:center; } .person .mini-avatar { width:29px; height:29px; border-radius:50%; display:grid; place-items:center; color:#216f5a; background:#e5f4ee; font-weight:700; font-size:12px; } .person small { color:var(--muted); display:block; font-size:11px; margin-top:1px; } .tag { display:inline-block; padding:4px 8px; border-radius:13px; font-size:11px; background:#eef3f1; color:#64716d; } .tag.green { color:#17815e; background:#e4f6ed; } .tag.orange { color:#b6691a; background:#fff1dc; } .tag.blue { color:#3d78cb; background:#e9f2ff; } .tag.red { color:#be4d58; background:#ffe8ea; } .table-action { color:var(--green); background:transparent; padding:3px 5px; font-size:12px; } .pagination { padding:13px 16px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:15px; } .resource-card { padding:0; overflow:hidden; } .resource-art { height:120px; background:linear-gradient(135deg,#7bbfa6,#d9e986 57%,#e7a36e 58%); position:relative; } .resource-art.course { background:linear-gradient(135deg,#eeac7e,#d57270 48%,#5da58e 49%); } .resource-art.product { background:linear-gradient(135deg,#f0a9c0,#f4d792 58%,#93c8b7 59%); } .resource-art:after { content:'纯粹艺术文化'; color:#fff; font-weight:700; font-size:16px; position:absolute; bottom:14px; left:15px; text-shadow:0 1px 4px rgba(0,0,0,.18); } .card-body { padding:14px; } .card-body h3 { font-size:15px; } .card-body p { color:var(--muted); font-size:12px; margin:5px 0 12px; } .card-footer { display:flex; align-items:center; justify-content:space-between; }
    .empty { padding:54px 20px; text-align:center; color:var(--muted); } .empty b { display:block; color:#4d5b55; margin-bottom:5px; }
    .modal { position:fixed; inset:0; z-index:10; display:none; place-items:center; background:rgba(23,40,33,.35); padding:20px; } .modal.show { display:grid; } .dialog { width:min(520px,100%); max-height:calc(100vh - 40px); overflow:auto; background:#fff; border-radius:14px; box-shadow:0 18px 55px rgba(17,39,31,.22); } .dialog-head { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); } .dialog-head h3 { margin:0; font-size:17px; } .close { color:#77847f; background:transparent; font-size:20px; padding:3px 7px; } .form { padding:18px 20px; } .field { margin-bottom:15px; } .field label { display:block; color:#51605a; font-size:12px; margin-bottom:7px; } .field input,.field select,.field textarea { width:100%; padding:10px 11px; border-radius:8px; border:1px solid var(--line); color:var(--ink); background:#fff; } .field textarea { min-height:78px; resize:vertical; } .form-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:21px; }
    .toast { position:fixed; left:50%; bottom:25px; z-index:20; color:#fff; background:#223a32; border-radius:8px; padding:11px 14px; font-size:13px; transform:translate(-50%,20px); opacity:0; pointer-events:none; transition:.2s; } .toast.show { opacity:1; transform:translate(-50%,0); }
    body.dark { --ink:#e4ece8; --muted:#8fa099; --line:#28352f; --green-soft:rgba(34,160,120,.16); --page:#0f1613; --panel:#17211d; --nav:#131c18; --shadow:0 6px 20px rgba(0,0,0,.4); }
    body.dark .header { background:rgba(19,28,24,.88); }
    body.dark .secondary, body.dark .dialog, body.dark .toolbar { background:var(--panel); }
    body.dark .secondary { color:#a9b8b1; border-color:var(--line); }
    body.dark .toolbar, body.dark .metric, body.dark .panel { border-color:var(--line); }
    body.dark .range { background:#0f1613; } body.dark .range button.active { background:#223129; color:#3fc79a; }
    body.dark .quick button { background:#1c2823; color:#b4c2bb; } body.dark .quick button:hover { background:#233129; }
    body.dark th { background:#141d19; color:#8fa099; border-color:var(--line); }
    body.dark td { border-color:#212d27; } body.dark .role-row { border-color:#212d27; }
    body.dark .tag { background:#222e28; color:#9db0a7; }
    body.dark .tag.green { background:rgba(24,153,91,.18); color:#4ec99b; }
    body.dark .tag.orange { background:rgba(216,135,35,.16); color:#e2a057; }
    body.dark .tag.blue { background:rgba(61,120,203,.18); color:#7ba9e8; }
    body.dark .tag.red { background:rgba(190,77,88,.18); color:#e58893; }
    body.dark .search, body.dark .select, body.dark .field input, body.dark .field select, body.dark .field textarea { background:#101915; color:var(--ink); border-color:var(--line); }
    body.dark .person .mini-avatar { background:#1d332a; color:#5fcaa4; }
    body.dark .nav button { color:#8b9a93; } body.dark .nav button span { color:#7b8c85; }
    body.dark .nav button.active, body.dark .nav button.active span { color:#3fc79a; }
    body.dark .sidebar-foot button, body.dark .head-icon { color:#8b9a93; }
    body.dark .empty b { color:#b4c2bb; }
    body.dark .metric-icon { background:#1c3040; } body.dark .metric-icon.green { background:#173428; } body.dark .metric-icon.orange { background:#3a2c14; } body.dark .metric-icon.purple { background:#2a2342; }
    @media (max-width:1120px) { .stats { grid-template-columns:repeat(2,1fr); } .dashboard-grid { grid-template-columns:1fr; } .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } } @media (max-width:760px) { .app { grid-template-columns:1fr; } .sidebar { position:static; padding:10px; gap:6px; border-right:0; border-bottom:1px solid var(--line); } .brand { padding:2px 6px; } .nav { overflow:auto; flex-direction:row; padding:3px 0; } .nav button { width:auto; white-space:nowrap; padding:8px 10px; } .nav button span { display:none; } .sidebar-foot { display:none; } .header { height:62px; padding:0 15px; } .header p,.head-link,.admin small { display:none; } .content { padding:18px 14px 34px; } .stats,.cards,.quick-grid,.split { grid-template-columns:1fr; } .quick-grid { gap:7px; } .quick button { min-height:64px; } .head-actions { gap:4px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand"><div class="brand-mark">纯</div><div><b>纯粹艺术文化</b><small>运营管理台 v1.0</small></div></div><nav class="nav" id="sidebarNav"></nav><div class="sidebar-foot"><button id="darkToggle" onclick="toggleDark()"><span id="darkIcon">◐</span><em id="darkLabel">深色模式</em></button><button id="collapseBtn" onclick="toggleCollapse()"><span id="collapseIcon">«</span><em id="collapseLabel">收起菜单</em></button></div></aside>
    <main class="main"><header class="header"><div><h1 id="headerTitle">运营仪表盘</h1><p id="headerDesc">全局运营概览与访问趋势</p></div><div class="head-actions"><button class="head-icon" title="通知" onclick="toast('暂无未读系统通知')">♧</button><div class="admin"><div class="avatar" id="headerAvatar">管</div><div><b id="headerAdminName">未登录</b><small>纯粹艺术文化 · 运营后台</small></div></div><button class="secondary" id="logoutBtn" onclick="logout()" style="display:none">退出登录</button></div></header><section class="content" id="content"></section></main>
  </div>
  <div class="modal" id="modal"><section class="dialog"><div class="dialog-head"><h3 id="modalTitle">新增内容</h3><button class="close" onclick="closeModal()">×</button></div><form class="form" id="modalForm"></form></section></div><div class="toast" id="toast"></div>
  <script src="/admin/live.js"></script>
</body>
</html>
